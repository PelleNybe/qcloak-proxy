[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "qcloak-proxy"
version = "0.1.0"
description = "Zero-trust Privacy Proxy for cloud-based quantum computers — reversible circuit obfuscation, circuit cutting, and local decoding."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Pelle Nyberg", email = "pelle@coraxcolab.com" },
]
maintainers = [
    { name = "Corax CoLAB", email = "contact@coraxcolab.com" },
]
keywords = [
    "quantum-computing",
    "qiskit",
    "privacy",
    "obfuscation",
    "circuit-cutting",
    "fastapi",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security",
]
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "qiskit-addon-cutting>=0.9.0",
    "qiskit-qasm3-import>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx[http2]>=0.27.0",
    "h2>=4.1.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
qcloak-proxy = "qcloak_proxy.cli:app"

[project.urls]
Homepage = "https://coraxcolab.com/"
Repository = "https://github.com/PelleNybe/qcloak-proxy"
Issues = "https://github.com/PelleNybe/qcloak-proxy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qcloak_proxy"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_subclassing_any = false
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
